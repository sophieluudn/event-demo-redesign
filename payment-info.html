<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>繳費資訊 | 2026 科技論壇 AI Agent 新賽局</title>
    <meta name="description" content="查看超商代碼或 ATM 轉帳的繳費資訊。" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/site.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <div class="banner">
        <div class="banner__inner">
          <img
            src="assets/banner.jpg"
            alt="2026 科技論壇 AI Agent 新賽局"
            width="1024"
            height="358"
          />
        </div>
      </div>
      <main
        class="container container--narrow shell__content payment-info"
        data-payment-info
      >
        <header class="hero"><h1>繳費資訊</h1></header>
        <div data-payment-info-content hidden>
          <div class="card card--padded">
            <dl>
              <div class="row">
                <dt class="label row__label">應繳金額</dt>
                <dd class="row__value">NT$ 250</dd>
              </div>
              <div class="row">
                <dt class="label row__label">繳費期限</dt>
                <dd class="row__value payment-info__deadline">
                  <time datetime="2026-11-13T23:59:59+08:00"
                    >2026-11-13 23:59:59</time
                  >
                </dd>
              </div>
              <!-- Demo 不產生可用的繳款代碼；正式串接時置換為金流回應。 -->
              <div class="row" data-payment-details="atm" hidden>
                <dt class="label row__label">銀行代碼</dt>
                <dd class="row__value">銀行代碼（示意）</dd>
              </div>
              <div class="row" data-payment-details="atm" hidden>
                <dt class="label row__label">轉帳代碼</dt>
                <dd class="row__value">ATM-XXXX-XXXX-XXXX（示意）</dd>
              </div>
              <div class="row" data-payment-details="convenience-store" hidden>
                <dt class="label row__label">超商繳費代碼</dt>
                <dd class="row__value">CVS-XXXX-XXXX-XXXX（示意）</dd>
              </div>
            </dl>
          </div>
          <p class="payment-info__notice">
            請於繳費期限前完成付款，逾期需重新報名。
          </p>
        </div>
        <p class="payment-info__notice" data-payment-info-missing>
          請先<a href="payment.html">選擇付款方式</a>，再查看繳費資訊。
        </p>
        <a class="btn btn--secondary btn--block" href="index.html"
          ><svg
            class="icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M19 12H5M12 19l-7-7 7-7" /></svg
          >返回活動主頁</a
        >
      </main>
      <footer class="footer">
        聯合報系 著作權所有 © udn.com All Rights Reserved.
      </footer>
    </div>
  </body>
</html>
