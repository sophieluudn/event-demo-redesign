<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>報名查詢 | 2026 科技論壇 AI Agent 新賽局</title>
  <meta name="description" content="透過手機號碼與簡訊驗證碼查詢 2026 科技論壇報名狀態。">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/site.js" defer></script>
</head>
<body>
<div class="shell">

<div class="banner"><div class="banner__inner"><img src="assets/banner.jpg" alt="2026 科技論壇 AI Agent 新賽局" width="1024" height="358"></div></div>
<main class="container container--narrow shell__content">
<div class="query"><div class="query__inner">
  <header class="hero"><h1>報名狀態查詢</h1></header>
  <form class="query__fields" method="get" action="query-result.html">
    <div>
      <label for="query-phone" class="label field__label">手機號碼 (報名時填寫的手機號碼) <span class="required-mark" aria-hidden="true">*</span></label>
      <div class="query__phone-row">
        <div class="query__phone-field">
          <input id="query-phone" class="control" name="phone" type="tel" inputmode="numeric" pattern="09[0-9]{8}" minlength="10" maxlength="10" placeholder="例如：0912345678" autocomplete="tel" aria-describedby="query-phone-error" required>
          <p class="field-error" id="query-phone-error" role="alert">手機號碼格式錯誤，請輸入 09 開頭的 10 碼數字。</p>
        </div>
        <button type="button" class="btn btn--primary query__send" data-send-otp aria-controls="otp-step" aria-expanded="false"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="is-idle">發送驗證碼</span><span class="is-sent" aria-live="polite">已發送</span></button>
      </div>
    </div>
    <div class="query__otp" id="otp-step" hidden>
      <div>
        <label for="query-otp" class="label field__label">簡訊驗證碼 <span class="required-mark" aria-hidden="true">*</span></label>
        <input id="query-otp" class="control" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" autocomplete="one-time-code" placeholder="請輸入 6 位數驗證碼" required>
      </div>
      <button type="submit" class="btn btn--primary btn--block">送出</button>
    </div>
    <a class="btn btn--secondary btn--block" href="index.html"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回首頁</a>
  </form>
</div></div>
</main>
<footer class="footer">聯合報系 著作權所有 © udn.com All Rights Reserved.</footer>
</div>
</body>
</html>
